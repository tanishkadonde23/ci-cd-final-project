apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean up the source workspace before the pipeline runs.
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -e
        echo "Starting cleanup task"
        if [ -n "$(WORKSPACE_SOURCE_PATH)" ] && [ -d "$(WORKSPACE_SOURCE_PATH)" ]; then
          find "$(WORKSPACE_SOURCE_PATH)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
        fi
        echo "Cleanup completed"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  description: Run Python unit tests using nose.
  workspaces:
    - name: source
  steps:
    - name: Run unit tests with nose
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        python -m pip install --no-cache-dir nose
        echo "Running unit tests with nose"
        nosetests
